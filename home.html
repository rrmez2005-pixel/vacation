<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation planner</title>

  <link rel="icon" href="images/plane.png"> 
  <link rel="stylesheet" href="/styles/styles.css"


</head>
<body>
  <div id="main">
      <fieldset>
        <legend>Destination</legend>
        <span class="err" id="err-Destination"></span>

        <select id="Destination" name="Destination">
          <option value="none">Choose a destination</option>
          <option value="Bali">Bali, Indonesia</option>
          <option value="Paris">Paris, France</option>
          <option value="Tokoyo">Tokoyo, Japan</option>
          <option value="Maldives">Maldives</option>
          <option value="NYC">New York City, USA</option>
        </select>
      </fieldset>

      <fieldset>
      <div class="fields">
            <label for="date"><strong>Departure Date</strong></label>
            <input type="date" id="date" name="date">
            <span class="err" id="err-date">Departure date is required</span>
      </div>
      </fieldset>

      <fieldset>
      <label for="guest">Number of travelers:</label>
      <input type="text" id="guest" name="guest">

      <span class="err" id="err-guest">A number of travelers must be selected</span>
      </fieldset>

      <!-- Submit button triggers the form action -->
      <button type="submit" id="order-button">Find My Vacation</button> 
  </div>
</body>
</html>
